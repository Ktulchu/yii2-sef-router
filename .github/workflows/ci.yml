name: PHP and Yii2 integration

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite
          tools: composer:v2
      - name: Install Yii2
        run: |
          composer config --no-plugins repositories.asset-packagist composer https://asset-packagist.org
          composer config --no-plugins allow-plugins.yiisoft/yii2-composer true
          composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Real Yii2 and SQLite integration
        run: php tests/integration.php
